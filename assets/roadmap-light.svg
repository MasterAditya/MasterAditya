<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Trajectory roadmap">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 16px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#0F172A; }
      .step  { font: 700 13px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#0F172A; }
      .sub   { font: 500 11px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#475569; }
      .card  { fill:#FFFFFF; stroke:#E2E8F0; stroke-width:1.25; rx:18; }
    </style>
  </defs>

  <rect width="1200" height="220" fill="#F8FAFC"/>
  <text class="title" x="48" y="52">Trajectory (what I’m building toward)</text>
  <rect x="48" y="66" width="1104" height="2" fill="url(#accent)" opacity="0.55"/>

  <g filter="url(#shadow)">
    <g transform="translate(48 92)">
      <rect class="card" width="210" height="92"/>
      <text class="step" x="16" y="36">Applied AI</text>
      <text class="sub" x="16" y="56">retrieval • evals • data</text>
    </g>
    <g transform="translate(274 92)">
      <rect class="card" width="210" height="92"/>
      <text class="step" x="16" y="36">Backend systems</text>
      <text class="sub" x="16" y="56">APIs • performance • reliability</text>
    </g>
    <g transform="translate(500 92)">
      <rect class="card" width="210" height="92"/>
      <text class="step" x="16" y="36">Agent observability</text>
      <text class="sub" x="16" y="56">traces • debugging • safety</text>
    </g>
    <g transform="translate(726 92)">
      <rect class="card" width="210" height="92"/>
      <text class="step" x="16" y="36">Research infra</text>
      <text class="sub" x="16" y="56">reproducibility • pipelines</text>
    </g>
    <g transform="translate(952 92)">
      <rect class="card" width="200" height="92"/>
      <text class="step" x="16" y="36">Computational aging</text>
      <text class="sub" x="16" y="56">long-horizon systems</text>
    </g>
  </g>

  <!-- Connector line -->
  <path d="M 160 184 L 1060 184" stroke="url(#accent)" stroke-width="3" opacity="0.55"/>

  <!-- Animated marker -->
  <circle r="6" fill="#2563EB">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 160 184 L 1060 184"/>
  </circle>
</svg>
