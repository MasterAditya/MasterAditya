<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Flokka architecture">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1220" flood-opacity="0.12"/>
    </filter>

    <style>
      .box { fill:#FFFFFF; stroke:#E2E8F0; stroke-width:1.25; rx:16; }
      .t1 { font: 700 14px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#0F172A; }
      .t2 { font: 500 12px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#475569; }
      .chip { fill:#F1F5F9; stroke:#E2E8F0; stroke-width:1; rx:999; }
      .cpt { font: 600 11px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill:#0F172A; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="#F8FAFC"/>

  <!-- Title row -->
  <g>
    <text x="48" y="56" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="800" fill="#0F172A">Flokka — retrieval & agent workflow pipeline</text>
    <rect x="48" y="70" width="1104" height="2" fill="url(#accent)" opacity="0.55"/>
  </g>

  <!-- Flow boxes -->
  <g filter="url(#shadow)">
    <!-- Box helper: width 190 height 92 -->
    <g transform="translate(48 110)">
      <rect class="box" width="190" height="92"/>
      <text class="t1" x="16" y="34">Ingestion</text>
      <text class="t2" x="16" y="54">files • notes • PDFs</text>
      <g>
        <rect class="chip" x="16" y="64" width="78" height="20"/>
        <text class="cpt" x="26" y="78">parsing</text>
      </g>
    </g>

    <g transform="translate(260 110)">
      <rect class="box" width="190" height="92"/>
      <text class="t1" x="16" y="34">Chunking</text>
      <text class="t2" x="16" y="54">structure + metadata</text>
      <g>
        <rect class="chip" x="16" y="64" width="98" height="20"/>
        <text class="cpt" x="26" y="78">normalization</text>
      </g>
    </g>

    <g transform="translate(472 110)">
      <rect class="box" width="190" height="92"/>
      <text class="t1" x="16" y="34">Embeddings</text>
      <text class="t2" x="16" y="54">vector representation</text>
      <g>
        <rect class="chip" x="16" y="64" width="86" height="20"/>
        <text class="cpt" x="26" y="78">model</text>
      </g>
    </g>

    <g transform="translate(684 110)">
      <rect class="box" width="190" height="92"/>
      <text class="t1" x="16" y="34">Vector retrieval</text>
      <text class="t2" x="16" y="54">hybrid search</text>
      <g>
        <rect class="chip" x="16" y="64" width="104" height="20"/>
        <text class="cpt" x="26" y="78">index</text>
      </g>
    </g>

    <g transform="translate(896 110)">
      <rect class="box" width="256" height="92"/>
      <text class="t1" x="16" y="34">Ranking + citations</text>
      <text class="t2" x="16" y="54">relevance + traceability</text>
      <g>
        <rect class="chip" x="16" y="64" width="128" height="20"/>
        <text class="cpt" x="26" y="78">evaluation</text>
      </g>
    </g>

    <g transform="translate(260 226)">
      <rect class="box" width="258" height="92"/>
      <text class="t1" x="16" y="34">Agent workflow</text>
      <text class="t2" x="16" y="54">tag • summarize • act</text>
      <g>
        <rect class="chip" x="16" y="64" width="112" height="20"/>
        <text class="cpt" x="26" y="78">tools</text>
      </g>
    </g>

    <g transform="translate(548 226)">
      <rect class="box" width="258" height="92"/>
      <text class="t1" x="16" y="34">Response layer</text>
      <text class="t2" x="16" y="54">API + UI delivery</text>
      <g>
        <rect class="chip" x="16" y="64" width="132" height="20"/>
        <text class="cpt" x="26" y="78">FastAPI • React</text>
      </g>
    </g>

    <g transform="translate(836 226)">
      <rect class="box" width="316" height="92"/>
      <text class="t1" x="16" y="34">Observability</text>
      <text class="t2" x="16" y="54">traces • metrics • evals</text>
      <g>
        <rect class="chip" x="16" y="64" width="160" height="20"/>
        <text class="cpt" x="26" y="78">debuggability</text>
      </g>
    </g>
  </g>

  <!-- Arrows (top row) -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.85">
    <path d="M 238 156 L 260 156"/>
    <path d="M 450 156 L 472 156"/>
    <path d="M 662 156 L 684 156"/>
    <path d="M 874 156 L 896 156"/>
  </g>

  <!-- Down and across arrow to agent workflow -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.85">
    <path d="M 1024 202 C 1024 222, 1002 232, 982 236 C 908 252, 782 260, 548 272"/>
    <path d="M 548 272 L 518 272"/>
  </g>

  <!-- Agent -> Response -> Observability arrows -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.85">
    <path d="M 518 272 L 548 272"/>
    <path d="M 806 272 L 836 272"/>
  </g>

  <!-- Moving dot (subtle motion) -->
  <circle r="5" fill="#0EA5E9">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 64 156 L 1152 156"/>
  </circle>
</svg>
